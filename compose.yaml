name: solo127-gridwitness
services:
  desk:
    build:
      context: .
      args:
        GRIDWITNESS_DEPS_IMAGE: ${GRIDWITNESS_DEPS_IMAGE:-python:3.11-slim}
    image: ${GRIDWITNESS_IMAGE:-solo127-gridwitness:1.0}
    network_mode: bridge
    ports:
      - "127.0.0.1:${GRIDWITNESS_PORT:-19927}:8000"
    volumes:
      - measurements:/var/lib/gridwitness
    init: true
volumes:
  measurements:
